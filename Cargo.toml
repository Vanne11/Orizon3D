[package]
name = "revoscan-linux"
version = "0.1.0"
edition = "2021"
description = "Aplicación de escaneo 3D para escáneres Revopoint (POP 2 / POP 3) en Linux"
license = "GPL-3.0"

[[bin]]
name = "revoscan"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
# Decodificador JPEG en Rust puro para el stream RGB en formato MJPG.
zune-jpeg = "0.4"

[profile.release]
opt-level = 3
lto = true
